<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./api.js"></script>
    <title>Votalperrico</title>
    <link rel="stylesheet" href="./main.css"/>
  </head>
  <body>
    <h1>Votalperrico</h1>
    <h3>¡Elige a tus favoritos!</h3>
    <input id="searcher-name" type="text" placeholder="Escribe un nombre...">
    <input id="searcher-breed" type="text" placeholder="Escribe una raza...">
    <select id="breed-list" name="breed">
      <option value="">Cualquier raza</option>
    </select>
    <button id="clear-perricos">Borrar</button>
    <a href="favoritos.html" style="margin: 5px; padding: 10px 15px; border: 2px solid #000000; border-radius: 5px; background-color: #fdf4be; display: inline-block; font-family: 'Lobster', sans-serif; text-decoration: none; color: #000000;">Ver Favoritos ⭐</a>
    <button id="add-1-perrico">Añadir 1 perrico más</button> <button id="add-5-perricos">Añadir 5 perricos más</button>
    <div id="name-buttons"></div>
    <div id="breeds-buttons"></div>
    <div id="dog-list"></div>
    <div class="lightbox" id="lightbox">
      <button class="lightbox-close" id="lightbox-close">✕</button>
      <img src="" alt="Imagen ampliada" id="lightbox-img">
    </div>
  </body>
  <script type="module" src="./main.js"></script>
</html>
