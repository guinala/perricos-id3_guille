<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votalperrico</title>
    <link rel="stylesheet" href="../css/base.css"/>
    <link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
    <!-- Botón de perfil -->
    <button id="user-profile-btn" title="Mi Perfil">
        👤
    </button>

    <!-- Botón de filtros -->
    <button id="filters-toggle-btn" title="Filtros">
        🔍
    </button>

    <!-- Título -->
    <h1>Votalperrico</h1>
    <h3>¡Elige a tus favoritos!</h3>

    <!-- Contenedor principal -->
    <div class="main-wrapper" id="main-wrapper">
        <!-- Sección de acciones -->
        <div class="actions-section">
            <div class="actions-grid">
                <div class="action-group">
                    <label class="action-label">Seleccionar raza para añadir</label>
                    <select id="breed-list" name="breed">
                        <option value="">Cualquier raza</option>
                    </select>
                </div>
                <div class="action-group">
                    <label class="action-label">Añadir perros</label>
                    <button id="add-1-perrico">+ 1 Perro</button>
                </div>
                <div class="action-group">
                    <label class="action-label">Añadir varios</label>
                    <button id="add-5-perricos">+ 5 Perros</button>
                </div>
                <div class="action-group">
                    <label class="action-label">Ver favoritos</label>
                    <a href="favoritos.html" class="btn-link">⭐ Favoritos</a>
                </div>
                <div class="action-group">
                    <label class="action-label">Eliminar todo</label>
                    <button id="clear-perricos">🗑️ Borrar Todo</button>
                </div>
            </div>
        </div>

        <!-- Lista de perros -->
        <div id="dog-list"></div>
    </div>

    <!-- Panel lateral de filtros -->
    <div class="filters-panel" id="filters-panel">
        <button class="close-filters" id="close-filters">✕</button>
        
        <div class="filters-panel-content">
            <h2>Filtros</h2>
            
            <!-- Filtros de búsqueda y raza -->
            <div class="filter-section">
                <h3>Búsqueda</h3>
                <div class="filter-group">
                    <label class="filter-label" for="searcher-name">🔍 Buscar por nombre</label>
                    <input id="searcher-name" type="text" placeholder="Escribe un nombre...">
                </div>
                <div class="filter-group">
                    <label class="filter-label" for="breed-filter-select">🐕 Filtrar por raza</label>
                    <select id="breed-filter-select">
                        <option value="">Todas las razas</option>
                    </select>
                </div>
            </div>

            <!-- Filtros de estado -->
            <div class="filter-section">
                <h3>Estado</h3>
                <div class="status-filters-vertical">
                    <button id="filter-liked" class="status-filter-btn" data-filter="liked">
                        <span class="icon">❤️</span>
                        <span>Me gusta</span>
                        <span class="count">0</span>
                    </button>
                    <button id="filter-disliked" class="status-filter-btn" data-filter="disliked">
                        <span class="icon">💔</span>
                        <span>No me gusta</span>
                        <span class="count">0</span>
                    </button>
                    <button id="filter-favorites" class="status-filter-btn" data-filter="favorites">
                        <span class="icon">⭐</span>
                        <span>Favoritos</span>
                        <span class="count">0</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay para cerrar el panel al hacer clic fuera -->
    <div class="filters-overlay" id="filters-overlay"></div>

    <!-- Lightbox para imágenes -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close">✕</button>
        <img src="" alt="Imagen ampliada" id="lightbox-img">
    </div>

    <script type="module" src="../js/main.js"></script>
</body>
</html>
